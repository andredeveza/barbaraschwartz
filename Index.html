<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>BS - Design System</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .palette { display: flex; gap: 20px; margin-top: 20px; }
        .color-box { width: 100px; height: 100px; border-radius: 8px; border: 1px solid #eee; }
    </style>
</head>
<body>
    <h1>Design System Bárbara Schwartz</h1>
    <p>Guia visual para aplicações web e projetos arquitetônicos.</p>
    
    <div class="palette">
        <div class="color-box" style="background: #494546;"></div>
        <div class="color-box" style="background: #8F8583;"></div>
        <div class="color-box" style="background: #E6C1A4;"></div>
    </div>
</body>
</html>
